# plainspeak rules
#
# Copy this file to rules/rules.yaml (git-ignored) and edit freely.
# The daemon reloads it on save; no restart needed.
#
# Precedence for max_lines: rule > profile > defaults.
# Instructions stack: defaults, then every matching profile, then rule text.
#
# Deterministic match keys (checked by the server):  app, title, channel, text, mode
# Conditional match keys (checked by Claude from the screenshot): person, sender_domain, thread

defaults:
  max_lines: 6
  read_instructions: |
    You are reading a message on Oscar's screen so he can understand it fast.
    Rewrite what the sender actually means in plain UK English.
    Lead with the point. Then: what they want from Oscar, by when, and anything
    implied but not said. Drop pleasantries, hedging and filler.
    Never invent facts. If something is ambiguous, say "unclear:" and name it.
    Never send anything back to Slack or Gmail. Your only output is the overlay.
  draft_instructions: |
    Oscar wrote this and wants it readable before he sends it.
    Fix spelling, word order and dropped words. Keep his voice, his meaning and
    his level of formality. Do not add content. Do not soften a direct message.
    Return only the corrected text, nothing else.

profiles:
  ai-drivel:
    max_lines: 4
    instructions: |
      This text was written by an AI. Strip the marketing tone, repeated points,
      caveats and bullet sprawl. Give the two or three things that actually matter.
  esl:
    instructions: |
      The sender writes English as a second or third language. Read for intent,
      not grammar. Translate idioms from their first language where you can spot
      them. Flag any word that may mean something different from what they wrote.
  dyslexic:
    instructions: |
      Expect phonetic spelling, swapped letters and missing small words.
      Reconstruct the intended sentence before interpreting it. Do not comment on
      the errors themselves.

rules:
  # --- Examples. Replace with your own. ---------------------------------------

  - name: ChatGPT and Claude tabs are always drivel
    match: { app: google chrome, title: "(ChatGPT|Claude|Gemini|Grok)" }
    profile: ai-drivel

  - name: Render farm channel is terse by nature
    match: { app: slack, channel: render-farm }
    max_lines: 3
    notes: "Jobs are referenced by Deadline job ID. Status words mean farm states, not moods."

  - name: Named colleague, ESL
    match: { app: slack, person: "Marco Rossi" }
    profile: esl
    notes: "Italian first language. 'Actually' usually means 'currently'."

  - name: Client domain, keep the commercial subtext
    match: { app: gmail, sender_domain: client.example.com }
    max_lines: 8
    instructions: |
      This is a client. After the plain summary, add one line starting
      "Subtext:" with what they are really asking for or worried about.

  - name: Long AI pastes in any Slack thread
    match: { app: slack, text: "(leverage|seamless|robust|delve|game-changer)" }
    profile: ai-drivel

  - name: My own drafts in Slack get the dyslexia pass
    match: { app: slack, mode: draft }
    profile: dyslexic
